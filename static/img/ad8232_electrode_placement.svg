<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3c6a5"/>
      <stop offset="100%" stop-color="#e5ae87"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="braGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="dotShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="600" y="54" text-anchor="middle" font-size="34" font-weight="700" fill="#1e293b" letter-spacing="-0.3">
    AD8232 ECG Electrode Placement — Front View
  </text>
  <text x="600" y="92" text-anchor="middle" font-size="24" font-weight="400" fill="#334155">
    (Mirror Image: Person Facing You)
  </text>

  <!-- ==================== LEFT FIGURE: MALE ==================== -->
  <g id="male-figure" transform="translate(345, 130)">
    <!-- R / L Orientation Labels -->
    <text x="-175" y="135" text-anchor="middle" font-size="36" font-weight="700" fill="#64748b">R</text>
    <text x="-175" y="160" text-anchor="middle" font-size="16" font-weight="500" fill="#334155">(Person's Right)</text>

    <text x="175" y="135" text-anchor="middle" font-size="36" font-weight="700" fill="#64748b">L</text>
    <text x="175" y="160" text-anchor="middle" font-size="16" font-weight="500" fill="#334155">(Person's Left)</text>

    <!-- Torso, Neck, Arms -->
    <path d="
      M -24,62
      L -24,84
      C -32,92 -72,98 -88,112
      C -104,126 -112,175 -118,225
      L -132,315
      C -135,332 -138,348 -134,362
      C -130,374 -120,376 -115,368
      C -111,361 -112,342 -108,325
      L -90,235
      L -82,165
      L -76,208
      C -73,235 -70,262 -72,292
      L 72,292
      C 70,262 73,235 76,208
      L 82,165
      L 90,235
      L 108,325
      C 112,342 111,361 115,368
      C 120,376 130,374 134,362
      C 138,348 135,332 132,315
      L 118,225
      C 112,175 104,126 88,112
      C 72,98 32,92 24,84
      L 24,62
      Z"
      fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="2" stroke-linejoin="round"/>

    <!-- Collarbones & Pectoral/Abdomen Subtle Lines -->
    <path d="M -52,112 Q -22,118 -4,114 M 52,112 Q 22,118 4,114" fill="none" stroke="#b97f59" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -68,178 Q -35,192 -6,184 M 68,178 Q 35,192 6,184" fill="none" stroke="#c78d67" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="264" r="2.2" fill="#b97f59"/>

    <!-- Shorts -->
    <path d="
      M -72,290
      L 72,290
      L 82,392
      L 10,392
      L 0,342
      L -10,392
      L -82,392
      Z"
      fill="url(#clothGrad)" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -73,302 L 73,302" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

    <!-- Head & Hair -->
    <ellipse cx="0" cy="34" rx="28" ry="34" fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="2"/>
    <!-- Ears -->
    <path d="M -28,30 C -33,30 -33,44 -27,45" fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="1.8"/>
    <path d="M 28,30 C 33,30 33,44 27,45" fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="1.8"/>
    <!-- Hair -->
    <path d="M -28,26 C -30,4 -16,-6 0,-6 C 16,-6 30,4 28,26 C 24,14 14,10 0,10 C -14,10 -24,14 -28,26 Z" fill="#4a3222" stroke="#2d1d13" stroke-width="1.5"/>
    <!-- Facial features -->
    <path d="M -15,26 Q -10,23 -5,26 M 5,26 Q 10,23 15,26" fill="none" stroke="#3b2618" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="-10" cy="32" r="2.2" fill="#2d1d13"/>
    <circle cx="10" cy="32" r="2.2" fill="#2d1d13"/>
    <path d="M 0,32 L 0,43 L -3,45" fill="none" stroke="#9e6240" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -8,52 Q 0,55 8,52" fill="none" stroke="#8a4f34" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Electrodes on Male -->
    <!-- Yellow: Right Chest (viewer's left) -->
    <circle cx="-38" cy="142" r="11" fill="#facc15" stroke="#1e293b" stroke-width="2" filter="url(#dotShadow)"/>
    <!-- Red: Left Chest (viewer's right) -->
    <circle cx="38" cy="142" r="11" fill="#dc2626" stroke="#1e293b" stroke-width="2" filter="url(#dotShadow)"/>
    <!-- Green: Right Abdomen (viewer's left) -->
    <circle cx="-36" cy="252" r="11" fill="#16a34a" stroke="#1e293b" stroke-width="2" filter="url(#dotShadow)"/>

    <!-- Figure Caption -->
    <text x="0" y="428" text-anchor="middle" font-size="22" font-weight="500" fill="#1e293b">Male</text>
  </g>

  <!-- ==================== RIGHT FIGURE: FEMALE (WITH BRA) ==================== -->
  <g id="female-figure" transform="translate(855, 130)">
    <!-- R / L Orientation Labels -->
    <text x="-175" y="135" text-anchor="middle" font-size="36" font-weight="700" fill="#64748b">R</text>
    <text x="-175" y="160" text-anchor="middle" font-size="16" font-weight="500" fill="#334155">(Person's Right)</text>

    <text x="175" y="135" text-anchor="middle" font-size="36" font-weight="700" fill="#64748b">L</text>
    <text x="175" y="160" text-anchor="middle" font-size="16" font-weight="500" fill="#334155">(Person's Left)</text>

    <!-- Torso, Neck, Arms -->
    <path d="
      M -19,62
      L -19,86
      C -28,94 -62,100 -76,114
      C -90,128 -98,176 -104,225
      L -118,315
      C -122,332 -124,348 -120,362
      C -116,374 -107,375 -102,367
      C -98,360 -99,342 -95,325
      L -80,235
      L -70,165
      L -64,205
      C -58,232 -56,255 -68,288
      L 68,288
      C 56,255 58,232 64,205
      L 70,165
      L 80,235
      L 95,325
      C 99,342 98,360 102,367
      C 107,375 116,374 120,362
      C 124,348 122,332 118,315
      L 104,225
      C 98,176 90,128 76,114
      C 62,100 28,94 19,86
      L 19,62
      Z"
      fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="2" stroke-linejoin="round"/>

    <!-- Collarbones & Navel -->
    <path d="M -44,114 Q -18,120 -4,116 M 44,114 Q 18,120 4,116" fill="none" stroke="#b97f59" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="264" r="2" fill="#b97f59"/>

    <!-- Sports Bra -->
    <path d="
      M -52,106
      L -38,102
      L -40,148
      C -22,162 22,162 40,148
      L 38,102
      L 52,106
      L 62,160
      L 56,210
      C 26,216 -26,216 -56,210
      L -62,160
      Z"
      fill="url(#braGrad)" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <!-- Bra bottom band -->
    <path d="M -57,196 C -26,202 26,202 57,196" fill="none" stroke="#334155" stroke-width="1.8"/>

    <!-- Pants / Leggings -->
    <path d="
      M -68,288
      C -30,294 30,294 68,288
      L 80,392
      L 10,392
      L 0,342
      L -10,392
      L -80,392
      Z"
      fill="url(#clothGrad)" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -69,301 C -30,307 30,307 69,301" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

    <!-- Head & Hair -->
    <ellipse cx="0" cy="34" rx="26" ry="33" fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="2"/>
    <path d="M -26,30 C -31,30 -31,44 -25,45" fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="1.8"/>
    <path d="M 26,30 C 31,30 31,44 25,45" fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="1.8"/>
    <!-- Hair (tied back) -->
    <path d="M -26,30 C -29,4 -16,-7 0,-7 C 16,-7 29,4 26,30 C 22,13 10,9 0,9 C -10,9 -22,13 -26,30 Z" fill="#4a3222" stroke="#2d1d13" stroke-width="1.5"/>
    <!-- Facial features -->
    <path d="M -14,26 Q -9,23 -4,26 M 4,26 Q 9,23 14,26" fill="none" stroke="#3b2618" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="-9" cy="32" r="2.1" fill="#2d1d13"/>
    <circle cx="9" cy="32" r="2.1" fill="#2d1d13"/>
    <path d="M 0,32 L 0,43 L -2.5,45" fill="none" stroke="#9e6240" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M -7,52 Q 0,55 7,52" fill="none" stroke="#a65b46" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Electrodes on Female (above bra & below bra band) -->
    <!-- Yellow: Right Chest (viewer's left, above bra) -->
    <circle cx="-28" cy="136" r="11" fill="#facc15" stroke="#1e293b" stroke-width="2" filter="url(#dotShadow)"/>
    <!-- Red: Left Chest (viewer's right, above bra) -->
    <circle cx="28" cy="136" r="11" fill="#dc2626" stroke="#1e293b" stroke-width="2" filter="url(#dotShadow)"/>
    <!-- Green: Right Abdomen (viewer's left, below bra band) -->
    <circle cx="-28" cy="246" r="11" fill="#16a34a" stroke="#1e293b" stroke-width="2" filter="url(#dotShadow)"/>

    <!-- Figure Caption -->
    <text x="0" y="428" text-anchor="middle" font-size="22" font-weight="500" fill="#1e293b">Female (with Bra)</text>
  </g>

  <!-- ==================== BOTTOM LEGEND ==================== -->
  <g id="legend" transform="translate(170, 592)">
    <rect x="0" y="0" width="860" height="52" rx="12" ry="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#cardShadow)"/>

    <!-- Yellow -->
    <circle cx="40" cy="26" r="12" fill="#facc15" stroke="#1e293b" stroke-width="2"/>
    <text x="64" y="32" font-size="19" font-weight="500" fill="#1e293b">Yellow — Right Chest (RA)</text>

    <!-- Red -->
    <circle cx="332" cy="26" r="12" fill="#dc2626" stroke="#1e293b" stroke-width="2"/>
    <text x="356" y="32" font-size="19" font-weight="500" fill="#1e293b">Red — Left Chest (LA)</text>

    <!-- Green -->
    <circle cx="600" cy="26" r="12" fill="#16a34a" stroke="#1e293b" stroke-width="2"/>
    <text x="624" y="32" font-size="19" font-weight="500" fill="#1e293b">Green — Right Abdomen (RL)</text>
  </g>
</svg>
